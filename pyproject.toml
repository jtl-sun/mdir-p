[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdir-p"
version = "2.15.0"
description = "A fast dual-pane PowerShell file manager with AI and document preview."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=1.0,<9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]

[project.optional-dependencies]
preview = [
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
m = "mdir.__main__:main"
mdir = "mdir.__main__:main"

[project.urls]
Homepage = "https://github.com/jtl-sun/mdir-p"
Issues = "https://github.com/jtl-sun/mdir-p/issues"

[tool.setuptools.packages.find]
include = ["mdir*"]
