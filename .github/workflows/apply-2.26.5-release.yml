name: Apply mDIR-P 2.26.5 release payload

on:
  push:
    branches:
      - release/2.26.5-stability
    paths:
      - .github/workflows/apply-2.26.5-release.yml

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and apply 2.26.5 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          parts = [
              ("part00", 10000),
              ("part01", 10000),
              ("part02", 10000),
              ("part03", 10000),
              ("part04", 20000),
              ("part06", 20000),
              ("part08", 20000),
              ("part10", 12672),
          ]
          chunks = []
          for name, expected in parts:
              data = (Path(".release_payload") / name).read_text(encoding="utf-8")
              if len(data) < expected:
                  raise SystemExit(f"{name}: expected at least {expected} chars, got {len(data)}")
              chunks.append(data[:expected])

          encoded = "".join(chunks)
          if len(encoded) != 112672:
              raise SystemExit(f"payload length mismatch: {len(encoded)}")
          Path("/tmp/mdir265.tar.gz").write_bytes(base64.b64decode(encoded, validate=True))
          PY
          tar -xzf /tmp/mdir265.tar.gz -C .

      - name: Verify release source
        run: |
          grep -F '__version__ = "2.26.5"' mdir/__init__.py
          grep -F 'THEME_NAME = "mDir theme"' mdir/theme.py
          grep -F 'height: 20;' mdir/ui/options.py
          grep -F 'HOTKEY_POLL_SECONDS = 0.25' mdir/app.py
          grep -F 'DIRECTORY_POLL_INTERVAL_SECONDS = 5.0' mdir/fast_app.py
          grep -F '## 2.26.5' CHANGELOG.md
          python -m compileall -q mdir tests/test_advanced.py

      - name: Commit release source
        run: |
          rm -rf .release_payload
          rm -f .github/workflows/apply-2.26.5-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release mDIR-P 2.26.5 stability build"
          git push origin HEAD:release/2.26.5-stability
